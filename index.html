<h1>Release Radar Sync</h1>
<p>A small personal tool. Every Friday it copies the songs from one Spotify playlist (Release Radar) into one private YouTube playlist, replacing last week's songs.</p>
<p>It is used by one person only and is not offered to the public.</p>
